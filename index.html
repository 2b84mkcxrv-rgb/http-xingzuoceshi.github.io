function symSVG(sign,size){
  const ec=ELEM_COLOR[sign.elem];

function drawSym(ctx,sign,cx,cy,size){
  const ec=ELEM_COLOR[sign.elem];

  g.addColorStop(0,ec[0]);g.addColorStop(1,ec[1]);
  ctx.save();ctx.translate(cx-size/2,cy-size/2);ctx.scale(size/100,size/100);

  ctx.stroke(new Path2D(SYMPATH[sign.id]));ctx.restore();
}

/* ---------- 状态与逻辑 ---------- */
let mode='simple', cur=0, list=[], score=[], picked=-1, resultSign=null, top3=[];

function start(m){
  mode=m;
  list = m==='simple' ? QUESTIONS.slice(0,10) : QUESTIONS.slice();
  score = new Array(12).fill(0);
  cur=0; picked=-1;
  show('view-quiz');
  renderQ();
}
function renderQ(){
  const q=list[cur];
  document.getElementById('qcount').textContent=(cur+1)+'/'+list.length;
  document.getElementById('qnum').textContent='QUESTION '+String(cur+1).padStart(2,'0');
  document.getElementById('qtext').textContent=q.q;
  document.getElementById('progBar').style.width=((cur)/list.length*100)+'%';
  const box=document.getElementById('opts'); box.innerHTML='';
  const labels=['A','B','C','D'];
  q.o.forEach((opt,i)=>{
    const d=document.createElement('div');
    d.className='opt'; d.dataset.i=i;
    d.innerHTML='<div class="dot">'+labels[i]+'</div><div>'+opt.t+'</div>';
    d.onclick=()=>choose(i);
    box.appendChild(d);
  });
}
function choose(i){
  picked=i;
  document.querySelectorAll('.opt').forEach((el,idx)=>el.classList.toggle('sel',idx===i));
  const add=list[cur].o[i].s;
  for(const k in add) score[+k]+=add[k];
  setTimeout(()=>{
    if(cur<list.length-1){cur++;renderQ();}
    else finish();
  },360);
}
function finish(){
  document.getElementById('progBar').style.width='100%';
  const arr=score.map((v,i)=>({i,v})).sort((a,b)=>b.v-a.v);
  const total=score.reduce((a,b)=>a+b,0)||1;
  top3=arr.slice(0,3).map(o=>({sign:SIGNS[o.i],pct:Math.round(o.v/total*100)}));
  resultSign=SIGNS[arr[0].i];
  renderResult();
  show('view-result');
}
function renderResult(){
  const s=resultSign, ec=ELEM_COLOR[s.elem];
  const chips=s.traits.map(t=>'<span class="chip">'+t+'</span>').join('');
  const bars=top3.map(t=>'<div class="bar"><span class="nm">'+t.sign.name+'</span><span class="track"><i style="background:linear-gradient(90deg,'+ec[0]+','+ec[1]+')" data-w="'+t.pct+'"></i></span><span class="pc">'+t.pct+'%</span></div>').join('');
  document.getElementById('rCard').innerHTML=
    '<div class="r-sym">'+symSVG(s,120)+'</div>'+
    '<div class="r-name">'+s.name+'</div>'+
    '<div class="r-en">'+s.en+'</div>'+
    '<div class="r-meta"><span class="tag e" style="background:linear-gradient(120deg,'+ec[0]+','+ec[1]+')">'+s.elem+'象星座</span><span class="tag">'+s.date+'</span></div>'+
    '<p class="r-desc">'+s.desc+'</p>'+
    '<div class="r-sec"><h4>你的星座关键词</h4><div class="chips">'+chips+'</div></div>'+
    '<div class="r-sec"><h4>匹配度 Top 3</h4><div class="bars">'+bars+'</div></div>'+
    '<div class="r-sec"><h4>给你的小建议</h4><div class="advice">'+s.advice+'</div></div>';
  requestAnimationFrame(()=>setTimeout(()=>{
    document.querySelectorAll('#rCard .bar>i').forEach(b=>b.style.width=b.dataset.w+'%');
  },120));
}
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}
function goHome(){show('view-home');}

/* ---------- 星座卡片生成（canvas 下载）---------- */
function downloadCard(){
  const s=resultSign, ec=ELEM_COLOR[s.elem];
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0e1a');g.addColorStop(1,'#1b2150');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=2;
  for(let r=120;r<700;r+=60){x.beginPath();x.arc(W/2,H/2,r,0,Math.PI*2);x.stroke();}
  x.fillStyle='#e9c46a';x.font='600 30px sans-serif';x.textAlign='center';
  x.fillText('ZODIAC · 星座人格测试',W/2,90);
  drawSym(x,s,W/2,380,340);
  x.fillStyle='#fff';x.font='800 64px sans-serif';x.fillText(s.name,W/2,650);
  x.fillStyle='#9aa3c7';x.font='500 28px sans-serif';x.fillText(s.en.toUpperCase()+'  ·  '+s.elem+'象星座  ·  '+s.date,W/2,700);
  x.fillStyle='#d7dcf5';x.font='30px sans-serif';
  wrapText(x,s.desc,W/2,770,W-160,46);
  x.fillStyle='#e9c46a';x.font='600 28px sans-serif';x.fillText('关键词：'+s.traits.join(' / '),W/2,1180);
  x.fillStyle='#6b7396';x.font='24px sans-serif';x.fillText('测一测你更符合哪个星座',W/2,H-60);
  const a=document.createElement('a');
  a.download='星座卡片_'+s.name+'.png';
  a.href=c.toDataURL('image/png');a.click();
  toast('星座卡片已保存 ✓');
}
function wrapText(ctx,text,cx,y,maxW,lh){
  const chars=text.split('');let line='',yy=y;
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,cx,yy);line=ch;yy+=lh;}
    else line+=ch;
  }
  ctx.fillText(line,cx,yy);
}

/* ---------- 星空 & 首页星座环 ---------- */
(function(){
  const sky=document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+1;
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    sky.appendChild(s);
  }
  const wheel=document.getElementById('wheel');
  const R=95;
  SIGNS.forEach((s,i)=>{
    const ang=(-90+i*30)*Math.PI/180;
    const px=115+R*Math.cos(ang), py=115+R*Math.sin(ang);
    const el=document.createElement('div');el.className='sym';
    el.style.left=px+'px';el.style.top=py+'px';
    el.innerHTML=symSVG(s,30);
    wheel.appendChild(el);
  });
})();
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),1800);
}
